# WZÓR, nie sekret do wdrożenia. Prawdziwe wartości nie należą do repozytorium.
# Na klastrze: External Secrets Operator, Sealed Secrets albo AWS Secrets Manager.
#
#   kubectl -n price-alerts create secret generic price-alerts-secret \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://user:haslo@host:5432/price_alerts' \
#     --from-literal=API_KEY='...'
apiVersion: v1
kind: Secret
metadata:
  name: price-alerts-secret
  namespace: price-alerts
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/price_alerts"
  API_KEY: "zmien-mnie"
