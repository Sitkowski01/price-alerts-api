apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: price-alerts-api
  namespace: price-alerts
spec:
  # Na k3s domyslnym kontrolerem jest Traefik; na EKS zwykle ingress-nginx albo ALB.
  # Adnotacja kubernetes.io/ingress.class jest wycofana — od 1.18 sluzy do tego to pole.
  ingressClassName: traefik
  rules:
    - host: alerts.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: price-alerts-api
                port:
                  name: http
