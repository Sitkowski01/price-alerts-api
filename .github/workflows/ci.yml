name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REJESTR: ghcr.io
  OBRAZ: ${{ github.repository }}

jobs:
  testy:
    name: Lint, testy i migracje
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: price_alerts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/price_alerts_test
      API_KEY: klucz-ci
      APP_ENV: test

    steps:
      - uses: actions/checkout@v7

      - name: uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Instalacja zależności
        run: uv sync --frozen

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — formatowanie
        run: uv run ruff format --check .

      - name: Migracje w górę
        run: uv run alembic upgrade head

      - name: Model zgodny z migracjami
        # `alembic check` wykrywa rozjazd miedzy models.py a wersjami migracji.
        # Bez tego latwo dodac kolumne i zapomniec o migracji.
        run: uv run alembic check

      - name: Migracje w dół i z powrotem
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Testy
        run: uv run pytest -v

  manifesty:
    name: Walidacja manifestów Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 k8s/

  obraz:
    name: Budowa obrazu
    runs-on: ubuntu-latest
    needs: [testy, manifesty]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Logowanie do GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REJESTR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadane obrazu
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REJESTR }}/${{ env.OBRAZ }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build i push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Na pull requeście tylko budujemy — do rejestru trafia dopiero main.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
